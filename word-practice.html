<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Guessing Game</title>
    <link rel="stylesheet" href="word-practice.css" />
  </head>
  <body>
    <div id="game-container">
      <h1>Word Guessing Game V2</h1>
      <textarea id="word-list-input" placeholder="Enter word list here (one word per line)"></textarea>
      <button type="button" id="set-word-list">Set Word List</button>
      <div id="word-display"></div>
      <input type="text" id="user-input" placeholder="Type your guess here" autocomplete="off" />
    </div>
    <script src="word-practice-words.js"></script>
    <script src="word-practice.js"></script>
  </body>
</html>
